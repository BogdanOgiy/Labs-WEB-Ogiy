<!DOCTYPE html>

</head>
<body>

      <h1>Settings</h1>

    </div>

    <div class="box">

            <th>Setting name</th>

            <td>
              <a href="#">

            </td>

            <td><button class="delete"></button></td>
          </tr>
          <tr>
            <td>
              <a href="#/">
                Content
              </a>
            </td>
            <td><span class="status active">Active</span></td>
            <td><button class="delete"></button></td>
          </tr>
          <tr>
            <td>
              <a href="#">
                Content
              </a>
            </td>
            <td><span class="status active">Active</span></td>
            <td><button class="delete"></button></td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
