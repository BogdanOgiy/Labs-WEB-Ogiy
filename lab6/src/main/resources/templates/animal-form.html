<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Animal Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --night-950: #0b1116;
            --night-900: #111b23;
            --night-800: #182834;
            --leaf-400: #5ca374;
            --leaf-300: #79bb8f;
            --sand-300: #d2b27c;
            --text-100: #edf3f7;
            --text-300: #b8c6d1;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #1f3645 0%, var(--night-950) 45%, #090d12 100%);
            color: var(--text-100);
        }

        .form-card {
            background: linear-gradient(160deg, rgba(24, 40, 52, 0.92), rgba(17, 27, 35, 0.94));
            border: 1px solid rgba(121, 187, 143, 0.2);
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.32);
        }

        .form-title {
            color: var(--text-100);
            font-weight: 700;
        }

        .btn-theme {
            background-color: var(--leaf-400);
            border-color: var(--leaf-400);
            color: #0d1a22;
            font-weight: 600;
        }

        .btn-theme:hover {
            background-color: var(--leaf-300);
            border-color: var(--leaf-300);
            color: #0d1a22;
        }

        .url-preview {
            background: rgba(34, 64, 82, 0.4);
            border: 1px dashed rgba(121, 187, 143, 0.35);
            border-radius: 0.5rem;
            padding: 0.75rem;
            color: var(--text-300);
        }

        .preview-label {
            font-size: 0.82rem;
            color: var(--sand-300);
            margin-bottom: 0.5rem;
        }

        .preview-hint {
            font-size: 0.84rem;
            color: var(--text-300);
        }

        .image-preview {
            max-height: 280px;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 1px solid rgba(121, 187, 143, 0.3);
            background: var(--night-800);
        }

        .form-control {
            background: rgba(11, 17, 22, 0.65);
            border-color: rgba(121, 187, 143, 0.22);
            color: var(--text-100);
        }

        .form-control:focus {
            background: rgba(11, 17, 22, 0.72);
            border-color: rgba(121, 187, 143, 0.5);
            box-shadow: 0 0 0 0.2rem rgba(121, 187, 143, 0.18);
            color: var(--text-100);
        }

        .form-control::placeholder {
            color: #90a2b0;
        }

        .form-label {
            color: var(--text-300);
        }

        .btn-back {
            border-color: rgba(121, 187, 143, 0.35);
            color: var(--leaf-300);
        }

        .btn-back:hover {
            border-color: rgba(121, 187, 143, 0.6);
            color: var(--text-100);
            background: rgba(121, 187, 143, 0.1);
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 form-card">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1 class="h3 mb-0 form-title" th:text="${pageTitle}">Animal Form</h1>
                        <a class="btn btn-back" th:href="@{/items}">Back</a>
                    </div>

                    <form th:action="@{${formAction}}" th:object="${item}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input id="name" type="text" class="form-control" placeholder="Amur Leopard" th:field="*{name}">
                        </div>

                        <div class="mb-3">
                            <label for="scientificName" class="form-label">Scientific Name</label>
                            <input id="scientificName" type="text" class="form-control" placeholder="Panthera pardus orientalis" th:field="*{scientificName}">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" class="form-control" rows="4" placeholder="Short facts about habitat and status..." th:field="*{description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="populationLeft" class="form-label">Population Left</label>
                            <input id="populationLeft" type="number" min="0" class="form-control" th:field="*{populationLeft}">
                        </div>

                        <div class="mb-4">
                            <label for="imageUrl" class="form-label">Image URL</label>
                            <input id="imageUrl" type="text" class="form-control" placeholder="https://example.com/animal.jpg" th:field="*{imageUrl}">
                            <div class="url-preview mt-2">
                                <div class="preview-label">Image preview</div>
                                <div id="previewHint" class="preview-hint">Paste URL to see photo preview.</div>
                            </div>
                            <img id="imagePreview"
                                 class="image-preview mt-3 w-100 d-none"
                                 alt="Animal image preview">
                        </div>

                        <button type="submit" class="btn btn-theme">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const imageUrlInput = document.getElementById("imageUrl");
    const imagePreview = document.getElementById("imagePreview");
    const previewHint = document.getElementById("previewHint");

    function updateImageUrlPreview() {
        const url = imageUrlInput.value.trim();
        if (!url) {
            previewHint.textContent = "Paste URL to see photo preview.";
            imagePreview.classList.add("d-none");
            imagePreview.removeAttribute("src");
            return;
        }

        previewHint.textContent = "Photo loaded from URL.";
        imagePreview.src = url;
        imagePreview.classList.remove("d-none");
    }

    imageUrlInput.addEventListener("input", updateImageUrlPreview);
    updateImageUrlPreview();
</script>
</body>
</html>
